<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Gimbly</title>
  <defs>
    <linearGradient id="gimbly-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D31"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="gimbly-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
    <radialGradient id="gimbly-iris" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#5D6BFF"/>
      <stop offset="0.55" stop-color="#26307A"/>
      <stop offset="1" stop-color="#0B0E26"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#gimbly-tile)"/>
  <!-- the G: a gimbal arm that ends in the axis holding the lens -->
  <path d="M362.1 149.9 A150 150 0 1 0 406 262 H330" fill="none" stroke="url(#gimbly-accent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lens -->
  <circle cx="256" cy="262" r="82" fill="#0A0B0C" stroke="#3C4046" stroke-width="6.6"/>
  <circle cx="256" cy="262" r="59" fill="url(#gimbly-iris)"/>
  <circle cx="256" cy="262" r="24.6" fill="#05060A"/>
  <ellipse cx="231.4" cy="237.4" rx="16.4" ry="9.8" fill="#FFFFFF" opacity="0.9" transform="rotate(-35 231.4 237.4)"/>
  <circle cx="279" cy="283.3" r="5.7" fill="#FFFFFF" opacity="0.45"/>
</svg>
