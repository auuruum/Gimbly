[package]
name = "gimbly"
description = "Unofficial cross-platform control app for OBSBOT cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui-phosphor = "0.14.0"
gimbly-vcam-shm.workspace = true
# Snapshots. Already in the tree through eframe, so it adds no new crates.
png = "0.18.1"

[build-dependencies]
object = { version = "0.40.0", default-features = false, features = ["write_core", "coff"] }
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
