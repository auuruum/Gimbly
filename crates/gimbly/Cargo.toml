[package]
name = "gimbly"
default-run = "gimbly"
description = "Unofficial cross-platform control app for OBSBOT cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
macos-camera-extension = []

[[bin]]
name = "gimbly"
path = "src/main.rs"

[[bin]]
name = "gimbly-camera-extension"
path = "src/bin/gimbly-camera-extension.rs"
required-features = ["macos-camera-extension"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui-phosphor = "0.14.0"
gimbly-vcam-shm.workspace = true
# Snapshots. Already in the tree through eframe, so it adds no new crates.
png = "0.18.1"

[build-dependencies]
object = { version = "0.40.0", default-features = false, features = ["write_core", "coff"] }
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
jiff = "0.2.38"
rfd = "0.17.2"
global-hotkey = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
linuxvideo = "0.3.5"
raw-window-handle = "0.6"
nix = { version = "0.31", features = ["ioctl"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
ashpd = { version = "0.14", default-features = false, features = ["global_shortcuts", "tokio"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
nusb = "0.2.9"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "dispatch2", "objc2-core-media", "AVMediaFormat",
    "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession",
    "AVCaptureVideoDataOutput",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSSet", "NSString", "NSValue", "NSUUID", "NSRunLoop",
] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media-io = "0.3.2"
objc2-system-extensions = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
