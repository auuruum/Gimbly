<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <title>Gimbly</title>
  <defs>
    <linearGradient id="gimbly-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D31"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="gimbly-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
    <radialGradient id="gimbly-iris" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#5D6BFF"/>
      <stop offset="0.55" stop-color="#26307A"/>
      <stop offset="1" stop-color="#0B0E26"/>
    </radialGradient>
  </defs>
  <!-- icon: same drawing as gimbly-icon.svg, scaled from 512 to 160 -->
  <g transform="scale(0.3125)">
