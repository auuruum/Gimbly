<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Gimbly sleep picture: night</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E26"/>
      <stop offset="1" stop-color="#1D2140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="120" r="3" opacity="0.7"/>
    <circle cx="310" cy="250" r="2" opacity="0.5"/>
    <circle cx="460" cy="90" r="2.5" opacity="0.6"/>
    <circle cx="620" cy="190" r="2" opacity="0.4"/>
    <circle cx="980" cy="110" r="3" opacity="0.6"/>
    <circle cx="1180" cy="230" r="2" opacity="0.5"/>
    <circle cx="1460" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="1390" cy="420" r="2" opacity="0.4"/>
    <circle cx="210" cy="520" r="2.5" opacity="0.5"/>
    <circle cx="120" cy="760" r="2" opacity="0.4"/>
    <circle cx="1500" cy="700" r="3" opacity="0.5"/>
    <circle cx="1270" cy="810" r="2" opacity="0.4"/>
    <circle cx="380" cy="820" r="2" opacity="0.3"/>
  </g>
  <!-- crescent moon -->
  <path d="M1270 150 A110 110 0 1 0 1370 330 A90 90 0 1 1 1270 150 Z" fill="#FFE2B8" opacity="0.9"/>
  <!-- a resting gimbal: the G arm around a closed lens -->
  <g transform="translate(544 194) scale(1)">
    <path d="M362.1 149.9 A150 150 0 1 0 406 262 H330" fill="none" stroke="url(#accent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="262" r="82" fill="#0A0B0C" stroke="#3C4046" stroke-width="6.6"/>
    <path d="M206 266 Q256 306 306 266" fill="none" stroke="#9AA3FF" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- z z z -->
  <g fill="none" stroke="#FFE2B8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M990 330 H1030 L990 370 H1030" stroke-width="9" opacity="0.9"/>
    <path d="M1050 270 H1080 L1050 300 H1080" stroke-width="7" opacity="0.7"/>
    <path d="M1100 220 H1122 L1100 242 H1122" stroke-width="5" opacity="0.5"/>
  </g>
</svg>
