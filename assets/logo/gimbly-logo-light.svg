      <path d="M166 90 V40 C166 22 178 10 196 10 C214 10 226 22 226 40 V90 M226 40 C226 22 238 10 256 10 C274 10 286 22 286 40 V90"/>
      <path d="M324 -40 V90"/>
      <circle cx="364" cy="50" r="40"/>
      <path d="M442 -40 V64 C442 82 450 90 468 90"/>
      <path d="M498 10 V50 C498 74 512 90 534 90 C556 90 570 74 570 50 M570 10 V100 C570 128 552 140 530 140 C514 140 502 134 494 124"/>
    </g>
    <circle cx="128" cy="-28" r="15" fill="url(#gimbly-accent)"/>
