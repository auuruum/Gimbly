    <path d="M362.1 149.9 A150 150 0 1 0 406 262 H330" fill="none" stroke="url(#gimbly-accent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="262" r="82" fill="#0A0B0C" stroke="#3C4046" stroke-width="6.6"/>
    <circle cx="256" cy="262" r="59" fill="url(#gimbly-iris)"/>
    <circle cx="256" cy="262" r="24.6" fill="#05060A"/>
    <ellipse cx="231.4" cy="237.4" rx="16.4" ry="9.8" fill="#FFFFFF" opacity="0.9" transform="rotate(-35 231.4 237.4)"/>
    <circle cx="279" cy="283.3" r="5.7" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <!-- wordmark "gimbly": monoline strokes on a 100-unit x-height -->
  <g transform="translate(200 44) scale(0.72)">
